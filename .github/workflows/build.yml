name: Build ESP32 HID Firmware
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          arduino-cli version

      - name: Setup ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install BLE HID libraries from GitHub
        run: |
          mkdir -p ~/Arduino/libraries
          cd ~/Arduino/libraries
          git clone --depth 1 https://github.com/T-vK/ESP32-BLE-Mouse.git || true
          git clone --depth 1 https://github.com/T-vK/ESP32-BLE-Keyboard.git || true
          ls -la ~/Arduino/libraries

      - name: Compile for ESP32-S3 N16R8
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=huge_app" \
            --output-dir ./build \
            ./esp32_ble_hid_injector.ino 2>&1 | tail -40

      - name: List build output
        run: ls -lh ./build/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp32-firmware
          path: ./build/*.bin
