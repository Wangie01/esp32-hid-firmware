name: Build ESP32 HID Firmware
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh

      - name: Setup ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install BLE HID libraries
        run: |
          mkdir -p ~/Arduino/libraries
          cd ~/Arduino/libraries
          git clone --depth 1 https://github.com/T-vK/ESP32-BLE-Mouse.git
          git clone --depth 1 https://github.com/T-vK/ESP32-BLE-Keyboard.git

      - name: Compile (capture log)
        run: |
          set -o pipefail
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=huge_app" \
            --output-dir ./build \
            ./esp32_ble_hid_injector.ino > compile.log 2>&1
          echo "COMPILE_EXIT=$?"
          tail -80 compile.log

      - name: Commit log + firmware
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions Bot"
          ls -lh ./build/ 2>/dev/null || echo "no build dir"
          git add -f compile.log 2>/dev/null || true
          git add -f build/*.bin 2>/dev/null || true
          git commit -m "build artifacts (auto)" 2>/dev/null || echo "nothing to commit"
          git push 2>/dev/null || echo "push failed"
