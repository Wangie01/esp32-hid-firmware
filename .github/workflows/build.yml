name: Build ESP32 HID Firmware
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh

      - name: Setup ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install BLE HID libraries
        run: |
          mkdir -p ~/Arduino/libraries
          cd ~/Arduino/libraries
          git clone --depth 1 https://github.com/T-vK/ESP32-BLE-Mouse.git
          git clone --depth 1 https://github.com/T-vK/ESP32-BLE-Keyboard.git
          ls

      - name: Show board options
        run: arduino-cli board details -b esp32:esp32:esp32s3 2>&1 | head -40

      - name: Compile
        run: |
          set -o pipefail
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=huge_app" \
            --output-dir ./build \
            ./esp32_ble_hid_injector.ino 2>&1 | tee compile.log
          echo "EXIT=$?"

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: compile.log

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: ./build/*.bin
          if-no-files-found: warn
